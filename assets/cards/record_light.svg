<svg xmlns="http://www.w3.org/2000/svg" width="440" height="306" viewBox="0 0 440 306" role="img" aria-labelledby="title">
<title id="title">record. Records what your PC plays and splits it into separate tracks, tagged with title, artist and cover art.</title>
<style>
.redact { transform-box: fill-box; transform-origin: left; animation: redact 7s ease-in-out infinite both; }
.label { animation: label 7s ease-in-out infinite both; }
@keyframes redact { 0%, 12% { transform: scaleX(0); } 24%, 86% { transform: scaleX(1); } 96%, 100% { transform: scaleX(0); } }
@keyframes label { 0%, 20% { opacity: 0; } 28%, 84% { opacity: 1; } 92%, 100% { opacity: 0; } }
.playhead { animation: play 9s linear infinite; }
@keyframes play { from { transform: translateX(0); } to { transform: translateX(var(--run)); } }
@media (prefers-reduced-motion: reduce) { .redact, .label, .playhead { animation: none; } }
</style>

<rect x="12.0" y="16" width="194.5" height="108" rx="9" fill="#f6f8fa" stroke="#d0d7de" stroke-dasharray="5 4"/><text x="109.25" y="66.5" text-anchor="middle" font-size="15.5" font-weight="600" fill="#1f2328">Names</text><text x="109.25" y="87.5" text-anchor="middle" font-size="13" fill="#59636e">three people or more</text><rect x="232.5" y="16" width="194.5" height="108" rx="9" fill="#ddf4ff" stroke="#0969da"/><text x="329.75" y="66.5" text-anchor="middle" font-size="15.5" font-weight="600" fill="#0969da">Shuffle</text><text x="329.75" y="87.5" text-anchor="middle" font-size="13" fill="#59636e">into one gift circle</text><path d="M206.5 70.0 C220.5 70.0 218.5 70.0 226.5 70.0" fill="none" stroke="#59636e" stroke-width="1.6" class="flow" style="animation-delay:0.15s"/><path d="M225.5 66.0 L232.5 70.0 L225.5 74.0" fill="none" stroke="#59636e" stroke-width="1.6"/><rect x="453.0" y="16" width="194.5" height="108" rx="9" fill="#ddf4ff" stroke="#0969da"/><text x="550.25" y="58.5" text-anchor="middle" font-size="15.5" font-weight="600" fill="#0969da">Links</text><text x="550.25" y="79.5" text-anchor="middle" font-size="13" fill="#59636e">one private link per</text><text x="550.25" y="95.5" text-anchor="middle" font-size="13" fill="#59636e">person</text><path d="M427.0 70.0 C441.0 70.0 439.0 70.0 447.0 70.0" fill="none" stroke="#59636e" stroke-width="1.6" class="flow" style="animation-delay:0.3s"/><path d="M446.0 66.0 L453.0 70.0 L446.0 74.0" fill="none" stroke="#59636e" stroke-width="1.6"/><rect x="673.5" y="16" width="194.5" height="108" rx="9" fill="#fbefff" stroke="#8250df"/><text x="770.75" y="58.5" text-anchor="middle" font-size="15.5" font-weight="600" fill="#8250df">Reveal</text><text x="770.75" y="79.5" text-anchor="middle" font-size="13" fill="#59636e">each link shows only its</text><text x="770.75" y="95.5" text-anchor="middle" font-size="13" fill="#59636e">own match</text><path d="M647.5 70.0 C661.5 70.0 659.5 70.0 667.5 70.0" fill="none" stroke="#59636e" stroke-width="1.6" class="flow" style="animation-delay:0.44999999999999996s"/><path d="M666.5 66.0 L673.5 70.0 L666.5 74.0" fill="none" stroke="#59636e" stroke-width="1.6"/><rect x="12" y="146" width="179.79999999999998" height="28" rx="14" fill="#eaeef2"/><text x="101.89999999999999" y="165" text-anchor="middle" font-size="13" fill="#1f2328">nobody draws themselves</text><rect x="199.79999999999998" y="146" width="219.39999999999998" height="28" rx="14" fill="#eaeef2"/><text x="309.5" y="165" text-anchor="middle" font-size="13" fill="#1f2328">no two people draw each other</text><rect x="427.19999999999993" y="146" width="173.2" height="28" rx="14" fill="#eaeef2"/><text x="513.8" y="165" text-anchor="middle" font-size="13" fill="#1f2328">static site, no server</text>

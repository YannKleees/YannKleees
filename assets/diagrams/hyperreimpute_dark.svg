<svg xmlns="http://www.w3.org/2000/svg" width="880" height="188" viewBox="0 0 880 188" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif">
<style>
.flow{stroke-dasharray:4 5;animation:flow 1.2s linear infinite}
@keyframes flow{to{stroke-dashoffset:-18}}
@media (prefers-reduced-motion:reduce){.flow{animation:none}}
</style>
<rect x="12.0" y="16" width="150.4" height="108" rx="9" fill="#161b22" stroke="#30363d" stroke-dasharray="5 4"/><text x="87.2" y="50.5" text-anchor="middle" font-size="15.5" font-weight="600" fill="#e6edf3">3 UCI datasets</text><text x="87.2" y="71.5" text-anchor="middle" font-size="13" fill="#8d96a0">airfoil,</text><text x="87.2" y="87.5" text-anchor="middle" font-size="13" fill="#8d96a0">compression, white</text><text x="87.2" y="103.5" text-anchor="middle" font-size="13" fill="#8d96a0">wine</text><rect x="188.4" y="16" width="150.4" height="108" rx="9" fill="#0c2d6b" stroke="#58a6ff"/><text x="263.6" y="58.5" text-anchor="middle" font-size="15.5" font-weight="600" fill="#58a6ff">Remove values</text><text x="263.6" y="79.5" text-anchor="middle" font-size="13" fill="#8d96a0">MCAR, MAR and MNAR</text><text x="263.6" y="95.5" text-anchor="middle" font-size="13" fill="#8d96a0">patterns</text><path d="M162.4 70.0 C176.4 70.0 174.4 70.0 182.4 70.0" fill="none" stroke="#8d96a0" stroke-width="1.6" class="flow" style="animation-delay:0.15s"/><path d="M181.4 66.0 L188.4 70.0 L181.4 74.0" fill="none" stroke="#8d96a0" stroke-width="1.6"/><rect x="364.8" y="16" width="150.4" height="108" rx="9" fill="#0c2d6b" stroke="#58a6ff"/><text x="440.0" y="50.5" text-anchor="middle" font-size="15.5" font-weight="600" fill="#58a6ff">HyperImpute</text><text x="440.0" y="71.5" text-anchor="middle" font-size="13" fill="#8d96a0">picks a model per</text><text x="440.0" y="87.5" text-anchor="middle" font-size="13" fill="#8d96a0">column</text><text x="440.0" y="103.5" text-anchor="middle" font-size="13" fill="#8d96a0">automatically</text><path d="M338.8 70.0 C352.8 70.0 350.8 70.0 358.8 70.0" fill="none" stroke="#8d96a0" stroke-width="1.6" class="flow" style="animation-delay:0.3s"/><path d="M357.8 66.0 L364.8 70.0 L357.8 74.0" fill="none" stroke="#8d96a0" stroke-width="1.6"/><rect x="541.2" y="16" width="150.4" height="108" rx="9" fill="#0c2d6b" stroke="#58a6ff"/><text x="616.4000000000001" y="58.5" text-anchor="middle" font-size="15.5" font-weight="600" fill="#58a6ff">Baselines</text><text x="616.4000000000001" y="79.5" text-anchor="middle" font-size="13" fill="#8d96a0">including CatBoost</text><text x="616.4000000000001" y="95.5" text-anchor="middle" font-size="13" fill="#8d96a0">with fixed settings</text><path d="M515.2 70.0 C529.2 70.0 527.2 70.0 535.2 70.0" fill="none" stroke="#8d96a0" stroke-width="1.6" class="flow" style="animation-delay:0.44999999999999996s"/><path d="M534.2 66.0 L541.2 70.0 L534.2 74.0" fill="none" stroke="#8d96a0" stroke-width="1.6"/><rect x="717.6" y="16" width="150.4" height="108" rx="9" fill="#2e1a4a" stroke="#d2a8ff"/><text x="792.8000000000001" y="58.5" text-anchor="middle" font-size="15.5" font-weight="600" fill="#d2a8ff">Compare</text><text x="792.8000000000001" y="79.5" text-anchor="middle" font-size="13" fill="#8d96a0">error and paired</text><text x="792.8000000000001" y="95.5" text-anchor="middle" font-size="13" fill="#8d96a0">tests</text><path d="M691.6 70.0 C705.6 70.0 703.6 70.0 711.6 70.0" fill="none" stroke="#8d96a0" stroke-width="1.6" class="flow" style="animation-delay:0.6s"/><path d="M710.6 66.0 L717.6 70.0 L710.6 74.0" fill="none" stroke="#8d96a0" stroke-width="1.6"/><rect x="12" y="146" width="298.59999999999997" height="28" rx="14" fill="#21262d"/><text x="161.29999999999998" y="165" text-anchor="middle" font-size="13" fill="#e6edf3">reproduces Table 2 of the ICML 2022 paper</text><rect x="318.59999999999997" y="146" width="285.4" height="28" rx="14" fill="#21262d"/><text x="461.29999999999995" y="165" text-anchor="middle" font-size="13" fill="#e6edf3">version check against hyperimpute 0.1.5</text><rect x="612.0" y="146" width="245.79999999999998" height="28" rx="14" fill="#21262d"/><text x="734.9" y="165" text-anchor="middle" font-size="13" fill="#e6edf3">a fixed CatBoost baseline beat it</text>
</svg>

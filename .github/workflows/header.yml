# Upload a new generator/photo.jpg (or edit anything in generator/) and this redraws the profile images.
# Every Monday it also redraws the activity and languages panel.
name: Redraw profile images

on:
  push:
    paths:
      - "generator/**"
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: generator/requirements.txt
      - uses: actions/cache@v4
        with:
          path: ~/.u2net
          key: rembg-models
      - run: pip install -r generator/requirements.txt
      - name: Header from the photo
        if: github.event_name != 'schedule'
        run: python generator/make_header.py --photo "$(ls generator/photo.* | head -n 1)"
      - name: Diagrams, buttons and stats
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python generator/make_visuals.py
          python generator/make_stats.py
      - name: Commit the new images
        run: |
          git config user.name "Yann"
          git config user.email "y.klees@student.maastrichtuniversity.nl"
          git add assets
          git diff --cached --quiet || (git commit -m "Redraw profile images" && git push)
